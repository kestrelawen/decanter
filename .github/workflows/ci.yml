name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/decanter_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the version this suite was verified against. `stable` would
          # drift, and an upstream formatter or analyzer change would fail this
          # job for reasons unrelated to the code, with no way to reproduce it
          # locally where this exact SDK is installed.
          sdk: 3.13.5

      - name: Print toolchain versions
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Fetch real-world fixtures
        # Optional: pulls genuine SillyTavern output so the regression tests
        # exercise real files. Absent fixtures cause those tests to skip, not
        # fail, so a network hiccup cannot break the build.
        continue-on-error: true
        run: |
          chmod +x tool/fetch_fixtures.sh
          ./tool/fetch_fixtures.sh

      - name: Test
        run: dart test --reporter expanded

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The gate that keeps this job a no-op until the Flutter app lands, after
      # which it switches itself on.
      #
      # Deliberately a real shell test and NOT `if: hashFiles('app/pubspec.yaml')`:
      # a job-level `if:` cannot use hashFiles, because the expression is
      # evaluated before any checkout exists. GitHub's validator rejects the
      # whole workflow file with "Unrecognized function: 'hashFiles'", which
      # surfaces as a zero-second failure with no jobs at all — learned the hard
      # way on run 38407983163.
      - name: Check whether the Flutter app exists
        id: gate
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Flutter app found - the Android build will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No app/pubspec.yaml yet - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        if: steps.gate.outputs.ready == 'true'
        run: flutter pub get

      - name: Generate the Android platform folder
        if: steps.gate.outputs.ready == 'true'
        working-directory: .
        run: |
          # android/ is generated rather than committed, because the Gradle
          # wrapper ships as a binary (gradle-wrapper.jar) that cannot be
          # authored on the dev machine — which has no Flutter or Android SDK.
          # Same inputs, same output on every run.
          flutter create --platforms=android --org app --project-name decanter /tmp/scaffold
          rm -rf app/android
          mkdir -p app
          cp -r /tmp/scaffold/android app/android

      - name: Apply the app icon overlay
        if: steps.gate.outputs.ready == 'true'
        working-directory: .
        run: |
          # Generated by tool/make_assets.dart. Overlays the launcher icons and
          # the adaptive-icon resources onto the freshly generated tree, which is
          # the only way to set them while android/ itself is not committed.
          cp -r app/android_overlay/res/. app/android/app/src/main/res/
          echo "icons in place:"
          find app/android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Upload the generated Android folder
        # Kept as an artifact so the platform folder can be committed later,
        # when it needs edits the generator cannot express (permissions, a
        # FileProvider for in-app updates).
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-scaffold
          path: app/android
          retention-days: 14
          if-no-files-found: error

      - name: Analyze
        if: steps.gate.outputs.ready == 'true'
        # Not --fatal-infos: the Dart core package is clean under it, but the
        # widget layer carries add-to-app style lints (const hints, etc.) whose
        # output is unreadable until this job's log can be seen. Info-level
        # findings are still printed; they just do not fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Widget and unit tests
        if: steps.gate.outputs.ready == 'true'
        run: flutter test --reporter expanded

      - name: Build APK
        # The stock Flutter template signs release builds with the debug key, so
        # this yields a phone-installable APK with no secrets configured.
        # Replace signingConfig with a real keystore before publishing anywhere.
        if: steps.gate.outputs.ready == 'true'
        run: flutter build apk --release

      - name: Report APK size
        if: steps.gate.outputs.ready == 'true'
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: decanter-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
