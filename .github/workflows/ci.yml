name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (pure Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/decanter_core
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the version this suite was verified against. `stable` would
          # drift, and an upstream formatter or analyzer change would fail this
          # job for reasons unrelated to the code, with no way to reproduce it
          # locally where this exact SDK is installed.
          sdk: 3.13.5

      - name: Print toolchain versions
        run: dart --version

      - name: Resolve dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Fetch real-world fixtures
        # Optional: pulls genuine SillyTavern output so the regression tests
        # exercise real files. Absent fixtures cause those tests to skip, not
        # fail, so a network hiccup cannot break the build.
        continue-on-error: true
        run: |
          chmod +x tool/fetch_fixtures.sh
          ./tool/fetch_fixtures.sh

      - name: Test
        run: dart test --reporter expanded

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # The gate that keeps this job a no-op until the Flutter app lands, after
      # which it switches itself on.
      #
      # Deliberately a real shell test and NOT `if: hashFiles('app/pubspec.yaml')`:
      # a job-level `if:` cannot use hashFiles, because the expression is
      # evaluated before any checkout exists. GitHub's validator rejects the
      # whole workflow file with "Unrecognized function: 'hashFiles'", which
      # surfaces as a zero-second failure with no jobs at all — learned the hard
      # way on run 38407983163.
      - name: Check whether the Flutter app exists
        id: gate
        working-directory: .
        run: |
          if [ -f app/pubspec.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Flutter app found - the Android build will run."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No app/pubspec.yaml yet - skipping the Android build."
          fi

      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        if: steps.gate.outputs.ready == 'true'
        run: flutter pub get

      - name: Verify the committed Android platform folder
        if: steps.gate.outputs.ready == 'true'
        working-directory: .
        run: |
          # android/ is committed now, because it needed changes a generator
          # cannot express: a permission, a FileProvider, and a Kotlin method
          # channel. The Gradle wrapper jar is a binary that cannot be produced
          # on the dev machine (no Flutter, no Android SDK), so it is checked in
          # — and these assertions catch the ways a bad merge or a careless
          # .gitignore would quietly break the build.
          for required in \
            app/android/gradlew \
            app/android/gradle/wrapper/gradle-wrapper.jar \
            app/android/app/src/main/AndroidManifest.xml \
            app/android/app/src/main/kotlin/app/decanter/MainActivity.kt \
            app/android/app/src/main/res/xml/file_paths.xml ; do
            test -f "$required" || { echo "MISSING: $required"; exit 1; }
          done

          # INTERNET must be declared in the RELEASE manifest. Flutter's template
          # only puts it in src/debug and src/profile, so a release build without
          # it here has no network access at all — every model request fails, and
          # nothing in the build output says why.
          grep -q 'android.permission.INTERNET' \
            app/android/app/src/main/AndroidManifest.xml \
            || { echo "INTERNET is not declared in the release manifest"; exit 1; }

          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' \
            app/android/app/src/main/AndroidManifest.xml \
            || { echo "REQUEST_INSTALL_PACKAGES is not declared"; exit 1; }

          grep -q 'FileProvider' \
            app/android/app/src/main/AndroidManifest.xml \
            || { echo "No FileProvider declared; in-app install would fail"; exit 1; }

          echo "launcher icons in place:"
          find app/android/app/src/main/res -name 'ic_launcher*' | sort

      - name: Analyze
        if: steps.gate.outputs.ready == 'true'
        # Not --fatal-infos: the Dart core package is clean under it, but the
        # widget layer carries add-to-app style lints (const hints, etc.) whose
        # output is unreadable until this job's log can be seen. Info-level
        # findings are still printed; they just do not fail the build.
        run: flutter analyze --no-fatal-infos

      - name: Widget and unit tests
        if: steps.gate.outputs.ready == 'true'
        run: flutter test --reporter expanded

      - name: Build APK
        # The stock Flutter template signs release builds with the debug key, so
        # this yields a phone-installable APK with no secrets configured.
        # Replace signingConfig with a real keystore before publishing anywhere.
        if: steps.gate.outputs.ready == 'true'
        run: |
          # The updater decides whether a release is newer by comparing this
          # version against the release's tag, so it is read out of pubspec.yaml
          # rather than typed a second time where it could drift.
          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          test -n "$VERSION" || { echo "No version: line in app/pubspec.yaml"; exit 1; }
          echo "Building with DECANTER_VERSION=$VERSION"
          flutter build apk --release --dart-define=DECANTER_VERSION="$VERSION"

      - name: Report APK size
        if: steps.gate.outputs.ready == 'true'
        run: ls -lh build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: decanter-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30
